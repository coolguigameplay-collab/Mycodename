name: Android Build

on: workflow_dispatch

jobs:
build:
name: Android Build
permissions: write-all
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setting up Haxe
    uses: krdlab/setup-haxe@v1
    with:
      haxe-version: 4.2.5

            - name: Find Haxe Compiler.hx
        run: |
          echo "=== HAXE ==="
          haxe --version
          which haxe

          echo "=== HAXE STD ==="
          echo "$HAXE_STD_PATH"

          echo "=== ALL Compiler.hx ==="
          find /opt/hostedtoolcache/haxe "$HAXE_STD_PATH" .haxelib \
            -type f -name "Compiler.hx" -print 2>/dev/null || true

          echo "=== HXCPP ==="
          haxelib path hxcpp || true

          echo "=== ANDROIDTOOLS ==="
          haxelib path extension-androidtools || true

  - name: Setup Android NDK
    uses: nttld/setup-ndk@main
    with:
      ndk-version: r25c

        - name: Installing/Updating libraries
        continue-on-error: true
        run: |
          haxelib setup .haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Diagnose Compiler.hx
        run: |
          echo "=== HAXE ==="
          haxe --version
          which haxe

          echo "=== HAXE STD ==="
          echo "$HAXE_STD_PATH"

          echo "=== ALL Compiler.hx ==="
          find . /opt/hostedtoolcache/haxe -type f -name "Compiler.hx" -print 2>/dev/null || true

          echo "=== HXCPP ==="
          haxelib path hxcpp || true

          echo "=== ANDROIDTOOLS ==="
          haxelib path extension-androidtools || true

          echo "=== SEARCH LINE 718 ==="
          for f in $(find . /opt/hostedtoolcache/haxe -type f -name "Compiler.hx" 2>/dev/null); do
            echo "===== $f ====="
            sed -n '700,730p' "$f" || true
          done

  - name: Rebuild hxcpp
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime rebuild hxcpp

  - name: Configure Android
    shell: bash
    run: |
      haxelib run lime setup -alias -y
      haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
      haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
      haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
      haxelib run lime config ANDROID_SETUP true

  - name: Building the game
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime build android -final

  - name: Uploading artifact
    uses: actions/upload-artifact@v4
    with:
      name: Codename Engine Legacy Android
      path: export/release/android/bin/app/build/outputs/apk/*
      if-no-files-found: error
