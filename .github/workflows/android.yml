name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-22.04

    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v4

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Verify Haxe installation
        shell: bash
        run: |
          echo "=== HAXE ==="
          which haxe
          haxe --version

          echo "=== HAXE STD PATH ==="
          haxe --std-path

          echo "=== HAXE_STD_PATH ==="
          echo "$HAXE_STD_PATH"

          echo "=== Compiler.hx FILES ==="
          find /opt/hostedtoolcache/haxe -type f -path "*/haxe/macro/Compiler.hx" -print 2>/dev/null || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Restore Previous Cache
        id: cache-debug-build-android-restore
        uses: actions/cache/restore@main
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build

            - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s
          echo "=== HAXE ==="
          which haxe
          haxe --version
          echo "=== HXCPP ==="
          haxelib path hxcpp
          echo "=== REBUILD HXCPP ==="
          haxelib run lime rebuild hxcpp

      - name: Rebuild hxcpp
        shell: bash
        run: |
          export HAXE_STD_PATH="$(haxe --std-path)"
          haxelib run lime rebuild hxcpp

      - name: Configure Android
        shell: bash
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
          haxelib run lime config ANDROID_SETUP true

      - name: Building the game
        shell: bash
        run: |
          export HAXE_STD_PATH="$(haxe --std-path)"
          haxelib run lime build android -final

      - name: Clear Previous Cache
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })

              if (
                caches.data.actions_caches &&
                caches.data.actions_caches.length > 0
              ) {
                for (const cache of caches.data.actions_caches) {
                  if (cache.key === "cache-android-build") {
                    console.log("Clearing " + cache.key + "...")
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    })
                  }
                }
              }
            } catch (error) {
              console.log(error.message)
            }

      - name: Save Current Cache
        id: cache-release-build-android-save
        uses: actions/cache/save@v4
        with:
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          key: cache-android-build

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Legacy Android
          path: export/release/android/bin/app/build/outputs/apk/*
