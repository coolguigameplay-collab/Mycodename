name: Android Build

on: workflow_dispatch

jobs:
build:
name: Android Build
permissions: write-all
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setting up Haxe
    uses: krdlab/setup-haxe@v1
    with:
      haxe-version: 4.2.5

  - name: Setup Android NDK
    uses: nttld/setup-ndk@main
    with:
      ndk-version: r25c

  - name: Installing/Updating libraries
    shell: bash
    run: |
      set -e
      rm -rf .haxelib
      mkdir -p .haxelib
      haxelib setup "$GITHUB_WORKSPACE/.haxelib"

      echo "=== HAXE ==="
      which haxe
      haxe --version
      export HAXE_STD_PATH="$(haxe --std-path)"
      echo "HAXE_STD_PATH=$HAXE_STD_PATH"

      echo "=== SETUP LIBRARIES ==="
      haxe -cp commandline -D analyzer-optimize --run Main setup -s

      echo "=== HXCPP ==="
      haxelib path hxcpp

      echo "=== ANDROIDTOOLS ==="
      haxelib path extension-androidtools

      echo "=== COMPILER.HX ==="
      find "$HAXE_STD_PATH" .haxelib /opt/hostedtoolcache/haxe -type f -name 'Compiler.hx' -print 2>/dev/null || true

  - name: Inspect Compiler.hx
    shell: bash
    run: |
      echo "=== HAXE MACRO COMPILER ==="
      COMPILER="$(find "$HAXE_STD_PATH" -type f -path '*/haxe/macro/Compiler.hx' -print -quit 2>/dev/null || true)"
      if [ -n "$COMPILER" ]; then
        echo "Compiler: $COMPILER"
        sed -n '705,730p' "$COMPILER"
      fi

      echo "=== HXCPP COMPILER ==="
      HXCOMPILER="$(find .haxelib -type f -name 'Compiler.hx' -print -quit 2>/dev/null || true)"
      if [ -n "$HXCOMPILER" ]; then
        echo "Compiler: $HXCOMPILER"
        sed -n '705,730p' "$HXCOMPILER"
      fi

  - name: Rebuild hxcpp
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime rebuild hxcpp

  - name: Configure Android
    shell: bash
    run: |
      haxelib run lime setup -alias -y
      haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
      haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
      haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
      haxelib run lime config ANDROID_SETUP true

  - name: Building the game
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime build android -final

  - name: Uploading artifact
    uses: actions/upload-artifact@v4
    with:
      name: Codename Engine Legacy Android
      path: export/release/android/bin/app/build/outputs/apk/*
      if-no-files-found: error
