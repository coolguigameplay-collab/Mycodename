name: Android Build

on: workflow_dispatch

jobs:
build:
name: Android Build
permissions: write-all
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setting up Haxe
    uses: krdlab/setup-haxe@v1
    with:
      haxe-version: 4.2.5

  - name: Setup Android NDK
    uses: nttld/setup-ndk@main
    with:
      ndk-version: r25c

              - name: Installing/Updating libraries
        shell: bash
        run: |
          set -e

          rm -rf .haxelib
          mkdir -p .haxelib
          haxelib setup "$GITHUB_WORKSPACE/.haxelib"

          echo "=== HAXE ==="
          haxe --version
          export HAXE_STD_PATH="$(haxe --std-path)"
          echo "HAXE_STD_PATH=$HAXE_STD_PATH"

          echo "=== INSTALL ANDROIDTOOLS ==="
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git

          echo "=== INSTALL HXCPP ==="
          haxelib git hxcpp https://github.com/CodenameCrew/cne-hxcpp.git

          echo "=== INSTALL REQUIRED LIBRARIES ==="
          haxelib install flixel-ui 2.6.1
          haxelib install hxvlc 1.9.3
          haxelib install format
          haxelib install markdown
          haxelib install nape-haxe4

          echo "=== VERIFY ==="
          haxelib list
          haxelib path extension-androidtools
          haxelib path hxcpp

  - name: Rebuild hxcpp
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime rebuild hxcpp

  - name: Configure Android
    shell: bash
    run: |
      haxelib run lime setup -alias -y
      haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
      haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
      haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
      haxelib run lime config ANDROID_SETUP true

  - name: Building the game
    shell: bash
    run: |
      export HAXE_STD_PATH="$(haxe --std-path)"
      haxelib run lime build android -final

  - name: Uploading artifact
    uses: actions/upload-artifact@v4
    with:
      name: Codename Engine Legacy Android
      path: export/release/android/bin/app/build/outputs/apk/*
      if-no-files-found: error
